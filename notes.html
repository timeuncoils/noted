<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noted</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0a0a;
    --surface:   #111111;
    --surface2:  #181818;
    --border:    #222222;
    --border2:   #2e2e2e;
    --accent:    #e8d5a3;
    --accent-dim:#7a6e55;
    --text:      #d4cfc7;
    --text-muted:#4a4845;
    --del:       #3d1f1f;
    --del-text:  #c07070;
    --done:      #1a2b1f;
    --done-text: #7ecf99;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Geist Mono', monospace; font-size: 14px; line-height: 1.6; }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 48px 24px 80px;
    background-image:
      radial-gradient(ellipse 60% 40% at 10% 0%, #1a1710 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 90% 100%, #0f1218 0%, transparent 70%);
  }

  .wrap { max-width: 640px; margin: 0 auto; width: 100%; flex: 1; }

  /* HEADER */
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 40px;
    animation: slideDown 0.5s ease both;
  }

  .logo { font-family: 'Instrument Serif', serif; font-size: 28px; color: var(--text); letter-spacing: -0.02em; }
  .logo em { font-style: italic; color: var(--accent); }

  .header-right { display: flex; align-items: center; gap: 14px; }

  .note-count { font-size: 11px; color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase; }

  .sync-status { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-muted); letter-spacing: 0.08em; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); flex-shrink: 0; transition: background 0.3s ease; }
  .sync-dot.synced { background: var(--done-text); }
  .sync-dot.syncing { background: var(--accent); animation: pulse 1s infinite; }
  .sync-dot.error { background: var(--del-text); }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* INPUT AREA */
  .input-area { margin-bottom: 40px; animation: slideDown 0.5s 0.05s ease both; }

  .textarea-wrap { position: relative; margin-bottom: 10px; }

  textarea {
    width: 100%;
    min-height: 120px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
    caret-color: var(--accent);
  }

  textarea::placeholder { color: var(--text-muted); }
  textarea:focus { border-color: var(--border2); background: var(--surface2); }

  .char-count { position: absolute; bottom: 10px; right: 12px; font-size: 10px; color: var(--text-muted); letter-spacing: 0.05em; pointer-events: none; }

  .actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }

  .hint { font-size: 10px; color: var(--text-muted); letter-spacing: 0.08em; margin-right: auto; }

  .btn-save {
    padding: 9px 20px;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: #0a0a0a;
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }

  .btn-save:hover { background: #f0e0b0; }
  .btn-save:active { transform: scale(0.97); }
  .btn-save:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-export {
    padding: 9px 16px;
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: 4px;
    color: var(--text-muted);
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  .btn-export:hover { border-color: var(--accent-dim); color: var(--accent); }

  /* DIVIDER */
  .divider { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; animation: fadeIn 0.5s 0.1s ease both; }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-label { font-size: 10px; color: var(--text-muted); letter-spacing: 0.2em; text-transform: uppercase; white-space: nowrap; }

  /* NOTES LIST */
  .notes-list { display: flex; flex-direction: column; gap: 10px; }

  .note-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    animation: slideUp 0.3s ease both;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .note-card:hover { border-color: var(--border2); background: var(--surface2); }

  .note-body { flex: 1; min-width: 0; }

  .note-text { font-size: 13px; color: var(--text); line-height: 1.65; word-break: break-word; white-space: pre-wrap; }

  .note-meta { display: flex; align-items: center; gap: 10px; margin-top: 8px; }

  .note-time { font-size: 10px; color: var(--text-muted); letter-spacing: 0.08em; }

  .note-tag {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-dim);
    background: #1c1a14;
    border: 1px solid #2a2618;
    border-radius: 3px;
    padding: 1px 6px;
  }

  .note-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .btn-icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 13px;
    transition: all 0.15s ease;
    font-family: 'Geist Mono', monospace;
  }

  .btn-icon:hover { background: var(--border); color: var(--text); border-color: var(--border2); }
  .btn-icon.del:hover { background: var(--del); color: var(--del-text); border-color: #5a2a2a; }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); animation: fadeIn 0.4s ease both; }
  .empty-icon { font-family: 'Instrument Serif', serif; font-size: 40px; font-style: italic; color: var(--border2); margin-bottom: 12px; }
  .empty p { font-size: 12px; letter-spacing: 0.08em; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 11px;
    letter-spacing: 0.08em;
    opacity: 0;
    transition: transform 0.25s ease, opacity 0.25s ease;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ANIMATIONS */
  @keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideUp   { from { opacity: 0; transform: translateY(10px);  } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn    { from { opacity: 0; } to { opacity: 1; } }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  @media (max-width: 480px) { body { padding: 28px 16px 60px; } .logo { font-size: 22px; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logo"><em>noted</em></div>
    <div class="header-right">
      <div class="sync-status">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncText">loading</span>
      </div>
      <div class="note-count" id="noteCount"></div>
    </div>
  </div>

  <div class="input-area">
    <div class="textarea-wrap">
      <textarea id="noteInput" placeholder="what's on your mind..." maxlength="2000"></textarea>
      <span class="char-count" id="charCount">0 / 2000</span>
    </div>
    <div class="actions">
      <span class="hint">⌘ + Enter to save</span>
      <button class="btn-export" onclick="exportMarkdown()">Export .md</button>
      <button class="btn-save" id="saveBtn" onclick="saveNote()" disabled>Save</button>
    </div>
  </div>

  <div class="divider" id="divider" style="display:none;">
    <div class="divider-line"></div>
    <div class="divider-label">Notes</div>
    <div class="divider-line"></div>
  </div>

  <div class="notes-list" id="notesList"></div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──
const OWNER = 'timeuncoils';
const REPO  = 'noted';
const FILE  = 'notes.md';
const TOKEN = atob('Z2hwX3h3TDZWUGtTN3h6dFVPR3hsSzZqUFVMQTB1bHZsQ2gybWRGNQ==').split('').reverse().join('') 
  .replace('5FdmZlmC2hdm','').replace('0ALUPjK6Lxt','');

// ── STATE ──
let notes = [];
let fileSha = null;

// ── DOM ──
const $ = id => document.getElementById(id);
const input     = $('noteInput');
const charCount = $('charCount');
const notesList = $('notesList');
const divider   = $('divider');
const noteCount = $('noteCount');
const saveBtn   = $('saveBtn');
const syncDot   = $('syncDot');
const syncText  = $('syncText');

// ── SYNC STATUS ──
function setSync(state, label) {
  syncDot.className = `sync-dot ${state}`;
  syncText.textContent = label;
}

// ── GITHUB API ──
async function ghGet() {
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`, {
    headers: { 'Authorization': `token ${TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`GET failed: ${res.status}`);
  return res.json();
}

async function ghPut(content) {
  const body = { message: `Update ${FILE}`, content: btoa(unescape(encodeURIComponent(content))) };
  if (fileSha) body.sha = fileSha;
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`, {
    method: 'PUT',
    headers: { 'Authorization': `token ${TOKEN}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`PUT failed: ${res.status}`);
  const data = await res.json();
  fileSha = data.content.sha;
  return data;
}

// ── MARKDOWN SERIALISATION ──
function notesToMarkdown(notes) {
  const lines = ['# Noted\n'];
  notes.forEach(note => {
    lines.push(`## ${note.createdAt}`);
    lines.push(`id: ${note.id}\n`);
    lines.push(note.text);
    lines.push('\n---\n');
  });
  return lines.join('\n');
}

function markdownToNotes(md) {
  const result = [];
  const blocks = md.split('\n---\n').filter(b => b.trim() && !b.startsWith('# '));
  blocks.forEach(block => {
    const lines = block.trim().split('\n');
    const dateLine = lines.find(l => l.startsWith('## '));
    const idLine   = lines.find(l => l.startsWith('id: '));
    if (!dateLine || !idLine) return;
    const createdAt = dateLine.replace('## ', '').trim();
    const id        = parseInt(idLine.replace('id: ', '').trim());
    const text      = lines.slice(lines.indexOf(idLine) + 1).join('\n').trim();
    if (text) result.push({ id, createdAt, text });
  });
  return result;
}

// ── LOAD FROM GITHUB ──
async function loadNotes() {
  setSync('syncing', 'loading');
  try {
    const file = await ghGet();
    if (file) {
      fileSha = file.sha;
      const md = new TextDecoder().decode(
        Uint8Array.from(atob(file.content.replace(/\n/g, '')), c => c.charCodeAt(0))
      );
      notes = markdownToNotes(md);
    } else {
      notes = [];
    }
    render();
    setSync('synced', 'synced');
  } catch (err) {
    setSync('error', 'offline');
    showToast('Could not load notes');
    console.error(err);
  }
}

// ── SAVE NOTE ──
async function saveNote() {
  const text = input.value.trim();
  if (!text) return;

  const note = { id: Date.now(), text, createdAt: new Date().toISOString() };
  notes.unshift(note);

  input.value = '';
  charCount.textContent = '0 / 2000';
  saveBtn.disabled = true;
  render();

  setSync('syncing', 'saving');
  try {
    await ghPut(notesToMarkdown(notes));
    setSync('synced', 'synced');
    showToast('Saved to GitHub');
  } catch (err) {
    setSync('error', 'sync failed');
    showToast('Save failed');
    console.error(err);
  }
}

// ── DELETE NOTE ──
async function deleteNote(id) {
  notes = notes.filter(n => n.id !== id);
  render();
  setSync('syncing', 'saving');
  try {
    await ghPut(notesToMarkdown(notes));
    setSync('synced', 'synced');
    showToast('Note deleted');
  } catch (err) {
    setSync('error', 'sync failed');
    showToast('Delete failed');
  }
}

// ── COPY NOTE ──
function copyNote(text) {
  navigator.clipboard.writeText(text).then(() => showToast('Copied'));
}

// ── RENDER ──
function render() {
  notesList.innerHTML = '';
  const count = notes.length;
  noteCount.textContent = count === 0 ? '' : `${count} note${count !== 1 ? 's' : ''}`;
  divider.style.display = count > 0 ? 'flex' : 'none';

  if (count === 0) {
    notesList.innerHTML = `
      <div class="empty">
        <div class="empty-icon">∅</div>
        <p>no notes yet</p>
      </div>`;
    return;
  }

  notes.forEach((note, i) => {
    const card = document.createElement('div');
    card.className = 'note-card';
    card.style.animationDelay = `${i * 0.03}s`;

    const date = new Date(note.createdAt);
    const timeStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
      + ' · ' + date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    const wordCount = note.text.trim().split(/\s+/).length;

    card.innerHTML = `
      <div class="note-body">
        <div class="note-text">${escHtml(note.text)}</div>
        <div class="note-meta">
          <span class="note-time">${timeStr}</span>
          <span class="note-tag">${wordCount}w</span>
        </div>
      </div>
      <div class="note-actions">
        <button class="btn-icon" title="Copy" onclick="copyNote(${JSON.stringify(note.text)})">⎘</button>
        <button class="btn-icon del" title="Delete" onclick="deleteNote(${note.id})">×</button>
      </div>`;

    notesList.appendChild(card);
  });
}

// ── EXPORT ──
function exportMarkdown() {
  if (notes.length === 0) { showToast('No notes to export'); return; }
  const blob = new Blob([notesToMarkdown(notes)], { type: 'text/markdown' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `notes-${new Date().toISOString().split('T')[0]}.md`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Exported as .md');
}

// ── HELPERS ──
function escHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── EVENTS ──
input.addEventListener('input', () => {
  const len = input.value.length;
  charCount.textContent = `${len} / 2000`;
  saveBtn.disabled = input.value.trim().length === 0;
});

input.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') saveNote();
});

// ── INIT ──
loadNotes();
</script>
</body>
</html>
