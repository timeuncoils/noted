<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noted</title>
<style>
body{
  background:#111;
  color:#e5e5e5;
  font-family:system-ui;
  max-width:700px;
  margin:40px auto;
  padding:20px;
}
textarea{
  width:100%;
  min-height:120px;
  background:#1c1c1c;
  border:1px solid #333;
  color:#fff;
  padding:12px;
  border-radius:6px;
}
button{
  margin-top:10px;
  padding:10px 18px;
  background:#8ab4f8;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:600;
}
.note{
  background:#1c1c1c;
  border:1px solid #333;
  padding:12px;
  border-radius:6px;
  margin-top:12px;
}
small{color:#888}
</style>
</head>
<body>

<h2>Noted</h2>

<textarea id="input" placeholder="Write something..."></textarea>
<button onclick="saveNote()">Save</button>

<div id="notes"></div>

<script>
const OWNER = "timeuncoils";   // change if needed
const REPO  = "noted";         // change if needed
const DIR   = "notes";

let TOKEN = localStorage.getItem("noted_token") || "";

if (!TOKEN) {
  TOKEN = prompt("Enter GitHub Personal Access Token:");
  if (TOKEN) localStorage.setItem("noted_token", TOKEN);
}

const headers = () => ({
  "Authorization": `token ${TOKEN}`,
  "Accept": "application/vnd.github.v3+json"
});

function encode(content){
  return btoa(unescape(encodeURIComponent(content)));
}

function decode(b64){
  return new TextDecoder().decode(
    Uint8Array.from(atob(b64.replace(/\n/g,'')), c => c.charCodeAt(0))
  );
}

async function saveNote(){
  const text = document.getElementById("input").value.trim();
  if (!text) return;

  document.getElementById("input").value = "";

  const id = Date.now();
  const filename = `${DIR}/${id}.md`;
  const created = new Date().toISOString();

  const content =
`# Note

created: ${created}
id: ${id}

${text}
`;

  try{
    const res = await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/${filename}`,
      {
        method:"PUT",
        headers:{...headers(),"Content-Type":"application/json"},
        body:JSON.stringify({
          message:`Add note ${id}`,
          content:encode(content)
        })
      }
    );

    if(!res.ok) throw new Error("Save failed");

    loadNotes();

  }catch{
    alert("Save failed.");
  }
}

async function loadNotes(){
  try{
    const res = await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}`,
      { headers: headers() }
    );

    if(res.status === 404){
      document.getElementById("notes").innerHTML =
        "<small>No notes yet.</small>";
      return;
    }

    const files = await res.json();
    const mdFiles = files.filter(f => f.name.endsWith(".md"));

    const loaded = await Promise.all(
      mdFiles.map(async f => {
        const r = await fetch(f.download_url);
        const text = await r.text();

        const id = parseInt(text.match(/id:\s*(\d+)/)?.[1] || 0);
        const created = text.match(/created:\s*(.+)/)?.[1] || "";
        const body = text.split("\n\n").slice(2).join("\n").trim();

        return { id, created, text: body };
      })
    );

    loaded.sort((a,b)=>b.id - a.id);

    render(loaded);

  }catch{
    alert("Load failed.");
  }
}

function render(notes){
  const container = document.getElementById("notes");
  container.innerHTML = "";

  notes.forEach(n=>{
    const div = document.createElement("div");
    div.className = "note";
    div.innerHTML = `
      ${escapeHtml(n.text)}
      <br>
      <small>${new Date(n.created).toLocaleString()}</small>
    `;
    container.appendChild(div);
  });
}

function escapeHtml(str){
  return str
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

loadNotes();
</script>
</body>
</html>
