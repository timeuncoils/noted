<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
  --bg:#000;
  --surface:#1c1c1e;
  --border:#2c2c2e;
  --text:#f2f2f7;
  --muted:#8e8e93;
  --accent:#0a84ff;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,system-ui;
  -webkit-font-smoothing:antialiased;
}

.app{
  max-width:720px;
  margin:0 auto;
  padding:
    calc(env(safe-area-inset-top) + 16px)
    16px
    calc(env(safe-area-inset-bottom) + 90px)
    16px;
}

h1{
  font-size:22px;
  font-weight:600;
  margin:0 0 16px 0;
}

.note{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  line-height:1.5;
  word-wrap:break-word;
}

.note small{
  display:block;
  margin-top:8px;
  font-size:12px;
  color:var(--muted);
}

/* Composer */
.composer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:
    10px 12px
    calc(env(safe-area-inset-bottom) + 12px)
    12px;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
}

.composer-inner{
  max-width:720px;
  margin:0 auto;
  display:flex;
  gap:10px;
  align-items:flex-end;
}

textarea{
  flex:1;
  resize:none;
  min-height:42px;
  max-height:160px;
  padding:12px 14px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-size:16px; /* prevents iOS zoom */
  outline:none;
}

button{
  padding:12px 18px;
  border-radius:20px;
  border:none;
  background:var(--accent);
  color:#fff;
  font-weight:600;
  font-size:15px;
}

button:active{
  opacity:0.8;
}

.empty{
  text-align:center;
  color:var(--muted);
  margin-top:40px;
}
</style>
</head>
<body>

<div class="app">
  <h1>Noted</h1>
  <div id="notes"></div>
</div>

<div class="composer">
  <div class="composer-inner">
    <textarea id="input" placeholder="Write something..."></textarea>
    <button onclick="saveNote()">Save</button>
  </div>
</div>

<script>
const OWNER = "timeuncoils";
const REPO  = "noted";
const DIR   = "notes";

let TOKEN = localStorage.getItem("noted_token") || "";

if (!TOKEN) {
  TOKEN = prompt("Enter GitHub Personal Access Token:");
  if (TOKEN) localStorage.setItem("noted_token", TOKEN);
}

const headers = () => ({
  "Authorization": `token ${TOKEN}`,
  "Accept": "application/vnd.github.v3+json"
});

function encode(content){
  return btoa(unescape(encodeURIComponent(content)));
}

async function saveNote(){
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  autoGrow(input);

  const id = Date.now();
  const filename = `${DIR}/${id}.md`;
  const created = new Date().toISOString();

  const content =
`# Note

created: ${created}
id: ${id}

${text}
`;

  const url =
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${filename}`;

  try{
    const res = await fetch(url,{
      method:"PUT",
      headers:{...headers(),"Content-Type":"application/json"},
      body:JSON.stringify({
        message:`Add note ${id}`,
        content:encode(content)
      })
    });

    if(!res.ok) throw new Error();
    loadNotes();

  }catch{
    alert("Save failed.");
  }
}

async function loadNotes(){
  try{
    const res = await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}`,
      { headers: headers() }
    );

    if(res.status === 404){
      document.getElementById("notes").innerHTML =
        "<div class='empty'>No notes yet</div>";
      return;
    }

    const files = await res.json();
    const mdFiles = files.filter(f => f.name.endsWith(".md"));

    const loaded = await Promise.all(
      mdFiles.map(async f=>{
        const r = await fetch(f.download_url);
        const text = await r.text();
        const id = parseInt(text.match(/id:\s*(\d+)/)?.[1] || 0);
        const created = text.match(/created:\s*(.+)/)?.[1] || "";
        const body = text.split("\n\n").slice(2).join("\n").trim();
        return { id, created, text: body };
      })
    );

    loaded.sort((a,b)=>b.id - a.id);
    render(loaded);

  }catch{
    alert("Load failed.");
  }
}

function render(notes){
  const container = document.getElementById("notes");
  container.innerHTML = "";

  if(!notes.length){
    container.innerHTML =
      "<div class='empty'>No notes yet</div>";
    return;
  }

  notes.forEach(n=>{
    const div = document.createElement("div");
    div.className = "note";
    div.innerHTML = `
      ${escapeHtml(n.text)}
      <small>${new Date(n.created).toLocaleString()}</small>
    `;
    container.appendChild(div);
  });
}

function escapeHtml(str){
  return str
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

/* Auto-grow textarea */
const textarea = document.getElementById("input");
textarea.addEventListener("input",()=>autoGrow(textarea));

function autoGrow(el){
  el.style.height="auto";
  el.style.height=(el.scrollHeight)+"px";
}

loadNotes();
</script>

</body>
</html>
