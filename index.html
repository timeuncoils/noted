<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noted</title>
<style>
body{background:#141414;color:#d4cfc7;font-family:monospace;padding:40px;max-width:700px;margin:auto}
textarea{width:100%;min-height:120px;padding:12px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:6px}
button{margin-top:10px;padding:8px 16px;background:#e8d5a3;border:none;border-radius:4px;cursor:pointer}
.note{background:#1a1a1a;border:1px solid #333;padding:10px;margin-top:10px;border-radius:6px}
small{color:#777}
</style>
</head>
<body>

<h2>Noted</h2>
<textarea id="input" placeholder="Write something..."></textarea>
<button onclick="save()">Save</button>

<div id="notes"></div>

<script>
const OWNER = "timeuncoils";
const REPO  = "noted";
const FILE  = "notes.md";

let TOKEN = localStorage.getItem("noted_token") || "";
let notes = [];
let sha = null;

if (!TOKEN) {
  TOKEN = prompt("Enter GitHub Personal Access Token:");
  if (TOKEN) localStorage.setItem("noted_token", TOKEN);
}

const headers = () => ({
  "Authorization": `token ${TOKEN}`,
  "Accept": "application/vnd.github.v3+json"
});

const apiURL = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;

const decode = b64 =>
  new TextDecoder().decode(
    Uint8Array.from(atob(b64.replace(/\n/g,'')), c => c.charCodeAt(0))
  );

async function ghGet() {
  const res = await fetch(apiURL, { headers: headers() });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error("GET failed");
  return res.json();
}

async function ghPut(content) {
  const latest = await ghGet();
  if (latest) sha = latest.sha;

  const body = {
    message: `Update ${FILE}`,
    content: btoa(unescape(encodeURIComponent(content)))
  };
  if (sha) body.sha = sha;

  const res = await fetch(apiURL, {
    method: "PUT",
    headers: { ...headers(), "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });

  if (!res.ok) throw new Error("PUT failed");
  const data = await res.json();
  sha = data.content.sha;
}

function toMarkdown(ns) {
  let out = "# Noted\n\n";
  ns.forEach(n => {
    out += `## ${n.date}\n`;
    out += `id: ${n.id}\n\n`;
    out += `${n.text}\n\n`;
    out += `---\n\n`;
  });
  return out;
}

function fromMarkdown(md) {
  const blocks = md.split("\n---");
  const result = [];

  blocks.forEach(block => {
    const trimmed = block.trim();
    if (!trimmed || trimmed.startsWith("# Noted")) return;

    const lines = trimmed.split("\n");
    const dateLine = lines.find(l => l.startsWith("## "));
    const idLine   = lines.find(l => l.startsWith("id: "));

    if (!dateLine || !idLine) return;

    const textStart = lines.indexOf(idLine) + 1;
    const text = lines.slice(textStart).join("\n").trim();

    result.push({
      id: parseInt(idLine.replace("id: ", "")),
      date: dateLine.replace("## ", "").trim(),
      text
    });
  });

  return result;
}

async function load() {
  try {
    const file = await ghGet();
    if (!file) {
      notes = [];
      render();
      return;
    }
    notes = fromMarkdown(decode(file.content));
    sha = file.sha;
    render();
  } catch {
    alert("Could not load notes.");
  }
}

async function save() {
  const text = document.getElementById("input").value.trim();
  if (!text) return;

  document.getElementById("input").value = "";

  try {
    const latest = await ghGet();
    if (latest) {
      sha = latest.sha;
      notes = fromMarkdown(decode(latest.content));
    }

    notes.unshift({
      id: Date.now(),
      date: new Date().toISOString(),
      text
    });

    await ghPut(toMarkdown(notes));
    render();
  } catch {
    alert("Save failed.");
  }
}

function render() {
  const container = document.getElementById("notes");
  container.innerHTML = "";

  if (!notes.length) {
    container.innerHTML = "<p><small>No notes yet.</small></p>";
    return;
  }

  notes.forEach(n => {
    const div = document.createElement("div");
    div.className = "note";
    const d = new Date(n.date);
    div.innerHTML = `
      ${escapeHtml(n.text)}
      <br>
      <small>${d.toLocaleString()}</small>
    `;
    container.appendChild(div);
  });
}

function escapeHtml(str) {
  return str
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

load();
</script>
</body>
</html>
